services:
  app:
    ports: !override
      - "127.0.0.1:8082:8080"
  postgres:
    ports: !override []
  # RabbitMQ & Grafana sebelumnya publish ke 0.0.0.0 (bypass UFW).
  # Bind ke loopback saja — container lain tetap akses lewat network docker.
  rabbitmq:
    ports: !override
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
  grafana:
    ports: !override
      - "127.0.0.1:3001:3000"
